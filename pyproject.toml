[project]
name = "card-draft"
version = "0.1.0"
description = "AI-помощник для подготовки товарных описаний контрольно-измерительных приборов"
requires-python = ">=3.11"
dependencies = ["django>=5.2,<6", "whitenoise>=6.7", "httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
card-draft = "card_draft.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["card_draft", "config"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
